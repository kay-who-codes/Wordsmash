<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔠 Wordsmash</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Wordsmash</h1>
    <div class="game-area">
      <div class="letter-piles">
        <div class="pile" id="pile1"></div>
        <div class="pile" id="pile2"></div>
      </div>
      <div class="pile action-card" id="pile3"></div>
    </div>
    <button id="deal-cards">Deal Cards</button>
    <button id="gain-point">Gain Point</button>
    <div class="scoreboard">
      <h2>Scoreboard</h2>
      <p id="score">Action Cards Collected: 0</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
